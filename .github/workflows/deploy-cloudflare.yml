name: Deploy game to Cloudflare
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: production-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '33edb1d089c357beea0cb74f821f1602' }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || 'c8e04964-b2a3-4483-bf3f-cb490d563699' }}
      WORKER_NAME: ${{ vars.WORKER_NAME || 'makhan-matki' }}
    steps:
      - name: Check deployment credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret before deployment.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/configure-cloudflare.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.external.json
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.external.json
      - run: npx wrangler deploy --config wrangler.external.json
